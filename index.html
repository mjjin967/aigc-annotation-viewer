<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Image annotations</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script>
/* ===================== CONFIG ===================== */
const CONFIG = {
  CSV_FILE:   'gemini_annotations_xDATA_1.csv',  // CSV in the same folder as index.html
  ID_COLUMN:  'filename',              // column holding the image file name (with or without extension)
  PEOPLE: ['jean', 'martin', 'diya', 'soham', 'tiziano'],
  HIDE_COLUMNS: ['status','raw_model_output'],                    // other columns to leave out of the panel
  BASE_DIR: '',                        // folder that contains the people folders, e.g. 'images' ('' = next to index.html)
  IMAGE_EXTENSIONS: ['.jpg', '.jpeg', '.png', '.webp', '.gif'],  // tried in order when file_id has no extension

  // ---- Filters ----
  // FILTER_COLUMNS: list the columns (dimensions) to get a dropdown, e.g. ['category', 'style'].
  // Leave as null to auto-detect: every visible column with at most MAX_FILTER_VALUES distinct values
  // (this skips free-text columns such as long descriptions).
  FILTER_COLUMNS: null,
  MAX_FILTER_VALUES: 30,

  // Columns whose cells hold several categories in one string, e.g. "sports | games/anime".
  // Each category becomes its own dropdown option (trimmed), and a row matches if it contains that category.
  MULTI_VALUE_COLUMNS: ['format_function', 'content'],
  MULTI_VALUE_SEPARATOR: /\|/,         // categories are separated by a pipe, e.g. "sports | games/anime"
};
/* ================================================== */
</script>
<style>
  :root {
    --stage: #34373b;
    --stage-edge: #2b2e31;
    --panel: #f5f6f7;
    --ink: #1d232b;
    --muted: #66707b;
    --rule: #dde1e5;
    --accent: #2f5d8a;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    color: var(--ink);
    background: var(--panel);
    display: grid;
    grid-template-columns: 1fr minmax(300px, 380px);
    grid-template-rows: 100%;
  }
  .stage {
    background: var(--stage);
    display: flex; align-items: center; justify-content: center;
    position: relative; overflow: hidden; padding: 24px;
  }
  .stage img {
    max-width: 100%; max-height: 100%; object-fit: contain;
    box-shadow: 0 0 0 1px var(--stage-edge);
    transition: opacity .15s;
  }
  .stage img.loading { opacity: .25; }
  .stage .msg {
    position: absolute; color: #c9ced3; font-size: 15px; max-width: 34em;
    text-align: center; line-height: 1.5; padding: 0 24px;
  }
  .stage .msg a { color: #fff; }

  aside {
    display: flex; flex-direction: column; min-height: 0;
    border-left: 1px solid var(--rule);
  }
  .nav {
    display: flex; align-items: center; gap: 8px;
    padding: 16px 20px; border-bottom: 1px solid var(--rule);
  }
  button, input {
    font: inherit; font-size: 14px; color: var(--ink);
    border: 1px solid var(--rule); background: #fff; border-radius: 6px;
    height: 34px;
  }
  .person {
    display: flex; align-items: center; gap: 10px;
    padding: 16px 20px 0; font-size: 14px; color: var(--muted);
  }
  select {
    flex: 1; font: inherit; font-size: 15px; font-weight: 500; color: var(--ink);
    border: 1px solid var(--rule); background: #fff; border-radius: 6px;
    height: 36px; padding: 0 8px; text-transform: capitalize; cursor: pointer;
  }
  button { padding: 0 12px; cursor: pointer; }
  button:hover:not(:disabled) { border-color: #b8bfc6; }
  button:disabled { color: #aab1b8; cursor: default; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .counter { margin-left: auto; display: flex; align-items: center; gap: 6px; font-size: 14px; color: var(--muted); }
  .counter input { width: 64px; padding: 0 8px; text-align: right; font-variant-numeric: tabular-nums; }
  .counter span { font-variant-numeric: tabular-nums; }

  /* ---- filters ---- */
  .filters { border-bottom: 1px solid var(--rule); margin-top: 16px; }
  .filters[hidden] { display: none; }
  .filters summary {
    display: flex; align-items: center; gap: 10px; cursor: pointer;
    padding: 10px 20px; font-size: 14px; color: var(--muted); list-style: none;
  }
  .filters summary::-webkit-details-marker { display: none; }
  .filters summary::before { content: "▸"; font-size: 12px; }
  .filters[open] summary::before { content: "▾"; }
  .filters .status { margin-left: auto; font-variant-numeric: tabular-nums; }
  .filter-grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 10px 12px;
    padding: 4px 20px 14px; max-height: 32vh; overflow-y: auto;
  }
  .filter-grid label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); min-width: 0; }
  .filter-grid select {
    width: 100%; flex: none; font-size: 13px; font-weight: 400; height: 30px;
    text-transform: none; text-overflow: ellipsis;
  }
  .filter-grid select.active { border-color: var(--accent); background: #eef3f8; }
  .filter-actions { padding: 0 20px 12px; }
  .filter-actions button { height: 28px; font-size: 13px; }

  .fields { overflow-y: auto; padding: 8px 20px 24px; margin: 0; }
  .fields dt {
    font-size: 13px; color: var(--muted); margin-top: 16px; font-weight: 500;
  }
  .fields dd {
    margin: 4px 0 0; font-size: 15px; line-height: 1.5;
    white-space: pre-wrap; overflow-wrap: anywhere;
  }
  .foot {
    margin-top: auto; padding: 12px 20px; border-top: 1px solid var(--rule);
    font-size: 12px; color: var(--muted); display: flex; justify-content: space-between; gap: 12px;
  }
  .foot a { color: var(--muted); }

  @media (max-width: 760px) {
    body { grid-template-columns: 1fr; grid-template-rows: 55vh auto; height: auto; }
    aside { border-left: 0; border-top: 1px solid var(--rule); }
  }
  @media (prefers-reduced-motion: reduce) { .stage img { transition: none; } }
</style>
</head>
<body>
  <main class="stage">
    <img id="img" alt="">
    <div class="msg" id="msg">Loading spreadsheet…</div>
  </main>

  <aside>
    <label class="person">
      Person
      <select id="person"></select>
    </label>

    <details class="filters" id="filters" open hidden>
      <summary>Filters <span class="status" id="filterStatus"></span></summary>
      <div class="filter-grid" id="filterGrid"></div>
      <div class="filter-actions"><button id="resetFilters" type="button">Reset all to None</button></div>
    </details>

    <div class="nav">
      <button id="prev" aria-label="Previous image">Previous</button>
      <button id="next" aria-label="Next image">Next</button>
      <label class="counter">
        <input id="jump" type="number" min="1" aria-label="Go to image number">
        <span id="total">/ 0</span>
      </label>
    </div>
    <dl class="fields" id="fields"></dl>
    <div class="foot">
      <span>← → to move</span>
      <a id="open" target="_blank" rel="noopener">Open image</a>
    </div>
  </aside>

<script>
const $ = id => document.getElementById(id);
let allRows = [], personRows = [], rows = [], idx = 0;
let dims = [];          // columns that get a filter dropdown
let filterSelects = {}; // column -> <select>

const cell = (row, col) => String(row[col] ?? '').trim();

// All categories in a cell. Multi-value columns are split, trimmed (whitespace, stray quotes/brackets),
// and de-duplicated; other columns return their single trimmed value.
const isMulti = col => CONFIG.MULTI_VALUE_COLUMNS.includes(col);
function values(row, col) {
  const v = cell(row, col);
  if (!v) return [];
  if (!isMulti(col)) return [v];
  const parts = v.split(CONFIG.MULTI_VALUE_SEPARATOR)
    .map(s => s.replace(/^[\s\[\]"']+|[\s\[\]"']+$/g, ''))
    .filter(Boolean);
  return [...new Set(parts)];
}

// ---- Work out which columns are filterable dimensions ----
function detectDims(fields) {
  const skip = new Set([CONFIG.ID_COLUMN, ...CONFIG.HIDE_COLUMNS]);
  if (Array.isArray(CONFIG.FILTER_COLUMNS)) {
    return CONFIG.FILTER_COLUMNS.filter(c => fields.includes(c) && c !== CONFIG.ID_COLUMN);
  }
  return fields.filter(c => {
    if (skip.has(c)) return false;
    const vals = new Set(allRows.flatMap(r => values(r, c)));
    if (isMulti(c)) return vals.size > 0;   // always filterable, however many categories
    return vals.size > 0 && vals.size <= CONFIG.MAX_FILTER_VALUES;
  });
}

// ---- Build one dropdown per dimension for the current person ----
function buildFilters() {
  const grid = $('filterGrid');
  grid.replaceChildren();
  filterSelects = {};
  const usable = dims.filter(d => personRows.some(r => values(r, d).length));
  $('filters').hidden = usable.length === 0;

  for (const d of usable) {
    const counts = new Map();
    for (const r of personRows) {
      for (const v of values(r, d)) counts.set(v, (counts.get(v) || 0) + 1);
    }
    const sel = document.createElement('select');
    sel.add(new Option('None', ''));
    [...counts.keys()]
      .sort((a, b) => a.localeCompare(b, undefined, { numeric: true, sensitivity: 'base' }))
      .forEach(v => sel.add(new Option(`${v} (${counts.get(v)})`, v)));
    sel.addEventListener('change', () => { sel.blur(); applyFilters(0); });

    const lab = document.createElement('label');
    lab.append(document.createTextNode(d), sel);
    grid.append(lab);
    filterSelects[d] = sel;
  }
}

function applyFilters(start = 0) {
  const active = Object.entries(filterSelects).filter(([, s]) => s.value !== '');
  for (const [, s] of Object.entries(filterSelects)) s.classList.toggle('active', s.value !== '');

  // "None" (empty value) means: don't filter on that dimension
  rows = personRows.filter(r => active.every(([d, s]) => values(r, d).includes(s.value)));

  $('filterStatus').textContent = active.length ? `${rows.length} of ${personRows.length}` : '';
  $('total').textContent = `/ ${rows.length}`;
  $('jump').max = rows.length;

  if (!rows.length) {
    $('img').removeAttribute('src');
    $('fields').replaceChildren();
    $('jump').value = '';
    $('prev').disabled = $('next').disabled = true;
    $('open').removeAttribute('href');
    showMsg('No images match the current filters. Set a dimension back to “None” to widen the results.');
    return;
  }
  go(start);
}

async function selectPerson(p, start = 0) {
  showMsg('Scanning folder…');
  await ensureIndex(p);
  personRows = rowsFor(p);
  buildFilters();   // filters reset to None whenever the person changes

  if (!personRows.length) {
    rows = [];
    $('total').textContent = '/ 0';
    $('jump').max = 0;
    $('img').removeAttribute('src');
    $('fields').replaceChildren();
    $('jump').value = '';
    $('prev').disabled = $('next').disabled = true;
    history.replaceState(null, '', `#${p}`);
    showMsg(`No images for ${p}. Nothing in ${p}/ (or its subfolders) matches a name in the ${CONFIG.ID_COLUMN} column. If the folder exists, make sure the server shows directory listings (e.g. <code>python3 -m http.server</code>).`);
    return;
  }
  applyFilters(start);
}

// ---- Local folder index: person -> Map(lowercase file name -> [urls]) ----
// Browsers can't list folders, so we read the server's directory listing
// (python3 -m http.server and most static servers provide one) and walk subfolders.
const fileIndex = {};
const dirBase = p => (CONFIG.BASE_DIR ? CONFIG.BASE_DIR.replace(/\/+$/, '') + '/' : '') + encodeURIComponent(p) + '/';

async function crawl(dirUrl, map, depth = 0) {
  if (depth > 10) return;
  let html;
  try { const r = await fetch(dirUrl); if (!r.ok) return; html = await r.text(); } catch { return; }
  const base = new URL(dirUrl, location.href);
  const doc = new DOMParser().parseFromString(html, 'text/html');
  for (const a of doc.querySelectorAll('a[href]')) {
    const href = a.getAttribute('href');
    if (!href || href[0] === '?' || href[0] === '#') continue;
    const u = new URL(href, base);
    if (u.origin !== base.origin || !u.pathname.startsWith(base.pathname) || u.pathname === base.pathname) continue;
    if (u.pathname.endsWith('/')) { await crawl(u.pathname, map, depth + 1); continue; }
    const name = decodeURIComponent(u.pathname.split('/').pop()).toLowerCase();
    if (!map.has(name)) map.set(name, []);
    map.get(name).push(u.pathname);
  }
}

async function ensureIndex(p) {
  if (!fileIndex[p]) { const m = new Map(); await crawl(dirBase(p), m); fileIndex[p] = m; }
  return fileIndex[p];
}

// Candidate URLs for a row: any match anywhere under <person>/, then direct-path guesses.
function candidates(row, p) {
  const name = String(row[CONFIG.ID_COLUMN]).trim().split('/').pop();
  const names = hasExt(name) ? [name] : CONFIG.IMAGE_EXTENSIONS.map(e => name + e);
  const map = fileIndex[p] || new Map();
  const out = [];
  for (const n of names) out.push(...(map.get(n.toLowerCase()) || []));
  if (!out.length) for (const n of names) out.push(dirBase(p) + encodeURIComponent(n));   // index empty/unavailable
  return out;
}
// Does this row's image exist somewhere under the person's folder?
// The CSV has no person column: a row belongs to whoever's folder contains its file.
function hasImage(row, p) {
  const map = fileIndex[p];
  if (!map || !map.size) return false;
  const name = String(row[CONFIG.ID_COLUMN]).trim().split('/').pop();
  const names = hasExt(name) ? [name] : CONFIG.IMAGE_EXTENSIONS.map(e => name + e);
  return names.some(n => map.has(n.toLowerCase()));
}
const rowsFor = p => allRows.filter(r => hasImage(r, p));
const hasExt = n => /\.[a-z0-9]{2,5}$/i.test(n);

function showMsg(html) { $('msg').innerHTML = html; $('msg').hidden = !html; }

function load() {
  Papa.parse(encodeURI(CONFIG.CSV_FILE), {
    download: true, header: true, skipEmptyLines: true,
    complete: async res => {
      const fields = res.meta.fields || [];
      if (!fields.includes(CONFIG.ID_COLUMN)) {
        showMsg(`No column named “${CONFIG.ID_COLUMN}” in ${CONFIG.CSV_FILE}. Columns found: ${fields.join(', ') || 'none'}. Check ID_COLUMN and CSV_FILE.`);
        return;
      }
      allRows = res.data.filter(r => (r[CONFIG.ID_COLUMN] || '').trim());
      if (!allRows.length) { showMsg('The sheet loaded but no rows have a file ID.'); return; }
      dims = detectDims(fields);

      showMsg('Scanning folders…');
      await Promise.all(CONFIG.PEOPLE.map(ensureIndex));   // so counts only include images that exist
      const sel = $('person');
      for (const p of CONFIG.PEOPLE) sel.add(new Option(`${p} (${rowsFor(p).length})`, p));
      const [hPerson, hNum] = decodeURIComponent(location.hash.slice(1)).split('/');
      if (CONFIG.PEOPLE.includes(hPerson)) sel.value = hPerson;
      selectPerson(sel.value, parseInt(hNum, 10) - 1 || 0);
    },
    error: () => showMsg(`Couldn’t load ${CONFIG.CSV_FILE}. Check CSV_FILE and that it sits next to index.html. If you opened this page by double-clicking it, run a local server instead (e.g. <code>python3 -m http.server</code>) and open <code>http://localhost:8000</code>.`),
  });
}

function go(i) {
  if (!rows.length) return;
  idx = Math.max(0, Math.min(rows.length - 1, i));
  const row = rows[idx];
  const cands = candidates(row, $('person').value);

  showMsg('');
  const img = $('img');
  img.classList.add('loading');
  img._cands = cands; img._i = 0;
  img.src = cands[0];
  img.alt = `Image ${idx + 1}`;

  const hide = new Set([ ...CONFIG.HIDE_COLUMNS]);
  const dl = $('fields');
  dl.replaceChildren();
  for (const [k, v] of Object.entries(row)) {
    if (hide.has(k) || v == null || String(v).trim() === '') continue;
    const dt = document.createElement('dt'); dt.textContent = k;
    const dd = document.createElement('dd'); dd.textContent = v;
    dl.append(dt, dd);
  }
  if (!dl.children.length) dl.innerHTML = '<dd style="color:var(--muted);margin-top:16px">No annotations for this image.</dd>';

  $('jump').value = idx + 1;
  $('prev').disabled = idx === 0;
  $('next').disabled = idx === rows.length - 1;
  $('open').href = cands[0];
  history.replaceState(null, '', `#${$('person').value}/${idx + 1}`);

  // warm the cache for the next image
  if (rows[idx + 1]) new Image().src = candidates(rows[idx + 1], $('person').value)[0];
}

$('img').addEventListener('load', e => e.target.classList.remove('loading'));
$('img').addEventListener('error', e => {
  const img = e.target;
  if (img._cands && ++img._i < img._cands.length) { img.src = img._cands[img._i]; return; }  // try next extension
  img.classList.remove('loading');
  const tried = (img._cands || []).join(', ');
  img.removeAttribute('src');
  showMsg(`Image ${idx + 1} didn’t load. Looked for: ${tried}. Check the folder and file name.`);
});

$('person').addEventListener('change', e => { selectPerson(e.target.value, 0); e.target.blur(); });
$('resetFilters').onclick = () => {
  Object.values(filterSelects).forEach(s => s.value = '');
  applyFilters(0);
};
$('prev').onclick = () => go(idx - 1);
$('next').onclick = () => go(idx + 1);
$('jump').addEventListener('change', e => go(parseInt(e.target.value, 10) - 1));
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
  if (e.key === 'ArrowLeft')  go(idx - 1);
  if (e.key === 'ArrowRight') go(idx + 1);
});

load();
</script>
</body>
</html>
